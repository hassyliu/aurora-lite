name: Build and publish Aurora Lite

on:
  push:
    branches: ['codex/release-v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debian13-amd64:
    runs-on: ubuntu-24.04
    container: debian:13-slim
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build tools
        run: |
          apt-get update
          apt-get install -y python3 python3-venv libpython3-dev binutils git ca-certificates curl nodejs

      - name: Check out release source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build Linux executable
        run: python3 scripts/build_binary.py

      - name: Test source and real GOST forwarding
        run: |
          .build-venv/bin/python -m pip install -r requirements-dev.txt
          .build-venv/bin/python -c "from pathlib import Path; from aurora import remote_agent as a; a.ROOT=Path('work/test-gost'); a.download_gost()"
          AURORA_TEST_GOST="$PWD/work/test-gost/bin/gost" .build-venv/bin/python -m unittest discover -s tests -v
          node --check aurora/static/app.js
          .build-venv/bin/python -m pip check

      - name: Smoke test packaged application
        run: .build-venv/bin/python scripts/smoke_binary.py dist/aurora-lite

      - name: Package release assets
        run: .build-venv/bin/python scripts/package_release.py

      - name: Publish release after all checks pass
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish_release.py
